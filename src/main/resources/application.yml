spring:
  application:
    name: medinfo
  profiles:
    # 아무 프로필도 안 주면 local. 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어씀
    default: local
  config:
    # 프로젝트 루트의 .env를 읽음 (없어도 기동은 됨)
    import: optional:file:.env[.properties]

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    job:
      # 기동할 때 잡을 자동 실행하지 않음. 실행은 Quartz → NonpayLoadLauncher가 판단
      enabled: false
    jdbc:
      # Batch 메타 테이블은 Flyway(V6)로 관리
      initialize-schema: never

  quartz:
    job-store-type: jdbc
    # Quartz 기본 스크립트는 재시작마다 테이블을 DROP → 트리거가 날아감. Flyway(V2)로 관리
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: medinfo-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      # Blue/Green 전환 중 인스턴스 2개가 떠도 같은 잡은 한 번만 실행
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.threadPool.threadCount: 4

publicdata:
  base-url: https://apis.data.go.kr
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  connect-timeout: 3s
  read-timeout: 10s
  max-retries: 2
  # 일일 한도 대비 이 비율을 넘으면 호출 차단
  quota-block-ratio: 0.95

collector:
  er-bed:
    enabled: true
    cron: "0 0/2 * * * ?"
  # 병원정보 전국 동기화: 매주 월요일 03:10 (약 80회 호출, 한도 10,000)
  hospital-sync:
    cron: "0 10 3 ? * MON"
  # 응급기관 목록 + 매칭: 매일 03:40 (1회 호출)
  er-hospital-sync:
    cron: "0 40 3 * * ?"
  # 비급여 요약·상세 적재: 매시간 20분에 확인 (이번 달 회차가 끝났으면 호출 없이 종료, 실패했으면 이어받기)
  nonpay:
    cron: "0 20 * * * ?"
  # 응급기관↔병원 매칭 규칙 (ErHospitalMatcher 주석 참고)
  er-match:
    radius-meters: 300            # 1단계 반경
    min-similarity: 0.5           # 1단계 이름 유사도 하한
    exact-name-radius-meters: 2000  # 2단계: 이름 완전일치면 이 반경까지
    contains-radius-meters: 100   # 3단계: 이름 포함관계면 이 반경까지
  # 첫 기동 때 비어 있으면 즉시 1회 실행
  bootstrap:
    enabled: true
  snapshot-retention-days: 7

# 비급여 조회 API
nonpay:
  # 홈 "많이 찾는 비급여"에 보여줄 항목 코드 (순서대로). 비워 두면 병원이 많은 항목을 자동으로 보여줌
  featured-codes: ""

# 응급실 조회 API: 병원 입력(hvidate)이 이 시간(분) 넘게 안 바뀌면 "갱신 안 됨 · 전화 확인 필요"로 표시
er:
  stale-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
