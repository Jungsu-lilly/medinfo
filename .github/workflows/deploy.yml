# main에 머지되면: 테스트 → 이미지 2개(api·web) 빌드·ECR 푸시 → EC2에 새 색 띄우기 → Caddy 전환 → 옛 색 내리기
# 되돌리기: Actions → deploy → Run workflow → tag에 예전 이미지 태그 입력 → 빌드 없이 그 이미지로 배포
# 다시 빌드: Run workflow (tag 비움) → 같은 커밋이어도 새로 빌드 (SITE_INDEXING 등 빌드 설정만 바꿨을 때)
#
# 이미지 태그 = 커밋 앞 7자리. 같은 커밋을 다시 빌드하면 "-실행번호"를 붙임 (ECR 태그는 덮어쓰기 불가)
#   예) 7ac32bb, 7ac32bb-41
# 이미지는 ARM(arm64)만 빌드 (서버 t4g). 2026-11 Caddy 전환 전의 태그는 x86이라 되돌리기 대상이 아님
#
# 저장소 Settings → Secrets and variables → Actions → Variables 에 필요한 것
#   AWS_ROLE_ARN   terraform output github_deploy_role_arn
#   SITE_INDEXING  공개 전 false(없으면 false), 오픈할 때 true
# EC2는 이름 태그(medinfo-app)로 찾는다 → 시크릿에 ID를 따로 넣지 않음
# 지금 서비스 중인 색은 EC2의 /opt/medinfo/active-color (switch.sh가 기록)
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "infra/**"
      - "http/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "되돌리기: 이미 올라간 이미지 태그(7ac32bb, 7ac32bb-41 등). 비우면 지금 커밋을 빌드해서 배포"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

# 배포는 한 번에 하나씩 (앞 배포가 끝날 때까지 기다림)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  PROJECT: medinfo
  SITE_URL: https://xn--639ao13amqh.com

jobs:
  test:
    if: github.event_name == 'push' || inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  # 이미지 태그 정하기: 커밋 앞 7자리, 이미 ECR에 있으면(같은 커밋 다시 빌드) 뒤에 실행번호
  tag:
    if: vars.AWS_ROLE_ARN != '' && (github.event_name == 'push' || inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: pick
        run: |
          TAG=${GITHUB_SHA::7}
          for repo in api web; do
            if aws ecr describe-images --repository-name "$PROJECT-$repo" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
              TAG="$TAG-$GITHUB_RUN_NUMBER"
              break
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "이미지 태그: $TAG"

  build:
    name: build ${{ matrix.name }}
    needs: [test, tag]
    # AWS가 아직 없으면(AWS_ROLE_ARN 미설정) 테스트만 하고 끝
    if: vars.AWS_ROLE_ARN != ''
    # 서버가 ARM(t4g)이라 ARM 러너에서 바로 빌드 (QEMU 에뮬레이션 없이). 공개 저장소는 무료
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: api
            context: .
          - name: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          # 되돌릴 때 이 태그를 입력
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-${{ matrix.name }}:${{ needs.tag.outputs.tag }}
          # web만 쓰는 값 (api 빌드에선 무시됨)
          build-args: |
            BACKEND_URL=http://api:8080
            SITE_URL=${{ env.SITE_URL }}
            SITE_INDEXING=${{ vars.SITE_INDEXING || 'false' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [tag, build]
    # 되돌리기(tag 입력)면 test·build가 건너뛰어진 상태로 실행
    if: always() && vars.AWS_ROLE_ARN != '' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 서버 찾기 · 지금 색 확인
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUILT_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          TAG=${INPUT_TAG:-$BUILT_TAG}
          [[ "$TAG" =~ ^[0-9a-f]{7}(-[0-9]+)?$ ]] || { echo "태그 형식: 커밋 앞 7자리(-실행번호): $TAG"; exit 1; }
          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$PROJECT-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE" != "None" ] || { echo "실행 중인 $PROJECT-app 서버 없음"; exit 1; }

          # 서버를 새로 만든 직후면 SSM 에이전트가 붙을 때까지 기다림 (최대 5분)
          for i in $(seq 1 60); do
            PING=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$PING" = "Online" ] && break
            [ "$i" -eq 60 ] && { echo "SSM 연결 안 됨: $INSTANCE ($PING)"; exit 1; }
            sleep 5
          done

          # 조회 자체가 실패하면 여기서 멈춤 (색을 잘못 골라 서비스 중인 색을 덮어쓰지 않게)
          OUT=$(.github/scripts/ssm-run.sh "$INSTANCE" "read active color" \
            "cat /opt/medinfo/active-color 2>/dev/null || echo none")
          ACTIVE=$(echo "$OUT" | grep -Eo '^(blue|green|none)' | tail -n 1 || true)
          case "$ACTIVE" in
            blue) TARGET=green ;;
            green) TARGET=blue ;;
            *) ACTIVE=none; TARGET=blue ;; # 첫 배포 (서버 새로 만듦)
          esac
          { echo "TAG=$TAG"; echo "INSTANCE=$INSTANCE"; echo "ACTIVE=$ACTIVE"; echo "TARGET=$TARGET"; } >> "$GITHUB_ENV"
          echo "지금: $ACTIVE → 새로 띄울 색: $TARGET, 이미지 $TAG, 서버 $INSTANCE"

      - name: EC2에 새 색 띄우기
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          RAW=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy
          .github/scripts/ssm-run.sh "$INSTANCE" "deploy $TARGET $TAG" \
            "set -e" \
            "cloud-init status --wait > /dev/null || true" \
            "mkdir -p /opt/medinfo && cd /opt/medinfo" \
            "for f in compose.yml deploy.sh cleanup.sh switch.sh edge.yml Caddyfile; do curl -fsSL $RAW/\$f -o \$f; done" \
            "bash deploy.sh $TARGET $TAG $REGISTRY"

      # Caddy가 보내는 곳을 새 색으로 바꾸고 실제 도메인으로 확인. 실패하면 switch.sh가 이전 색으로 되돌림
      - name: 트래픽 전환 (Caddy)
        id: switch
        run: |
          .github/scripts/ssm-run.sh "$INSTANCE" "switch $TARGET" "cd /opt/medinfo" "bash switch.sh $TARGET"

      - name: 옛 색 내리기
        if: env.ACTIVE != 'none'
        run: |
          # Caddy reload 전에 들어온 요청이 옛 색에서 끝날 시간 (앱 graceful shutdown 30초와 맞춤)
          .github/scripts/ssm-run.sh "$INSTANCE" "cleanup $ACTIVE" "sleep 30" "bash /opt/medinfo/cleanup.sh $ACTIVE"

      # 전환 전에 실패하면 새로 띄운 색만 치운다 (서비스 중인 색은 그대로)
      # 첫 배포(ACTIVE=none)는 원인을 볼 수 있게 남겨 둔다
      - name: 실패 정리
        if: failure() && steps.switch.outcome != 'success' && env.TARGET != '' && env.ACTIVE != 'none'
        run: |
          .github/scripts/ssm-run.sh "$INSTANCE" "rollback $TARGET" "bash /opt/medinfo/cleanup.sh $TARGET" || true
          echo "새 색($TARGET)을 내렸음. 서비스는 $ACTIVE 그대로"
