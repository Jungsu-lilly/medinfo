# PR마다: 백엔드 테스트 + 화면 린트·빌드. 통과해야 머지
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: api 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  web:
    name: web 린트·빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SITE_INDEXING: "false"

  infra:
    name: 인프라·배포 스크립트 검사
    # PR에서만 (배포 때는 이미 PR에서 통과한 코드)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt · validate (상태·AWS 접속 없이)
        working-directory: infra/environments/prod
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate
      - name: 배포 스크립트 (shellcheck)
        run: shellcheck deploy/*.sh .github/scripts/*.sh infra/modules/app-server/user_data.sh
      - name: Caddyfile · compose 문법
        working-directory: deploy
        run: |
          mkdir -p /tmp/caddy && cp Caddyfile /tmp/caddy/
          printf 'reverse_proxy 127.0.0.1:3000 {\n\theader_up X-Forwarded-Proto https\n}\n' > /tmp/caddy/active.caddy
          docker run --rm -e ORIGIN_VERIFY=ci-test -v /tmp/caddy:/etc/caddy:ro "$(grep -oP 'image: \K\S+' edge.yml)" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          touch caddy.env
          AWS_REGION=ap-northeast-2 docker compose -f edge.yml config -q
          touch .env
          AWS_REGION=ap-northeast-2 API_IMAGE=x WEB_IMAGE=x WEB_PORT=3000 MGMT_PORT=9000 COLOR=blue \
            docker compose -f compose.yml config -q
